<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#f8fafc"/><style>.t{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#102a43}.h{font:700 30px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.s{font:16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#627d98}.lh{font:700 21px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.ct{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.cb{font:13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#334e68}.card{fill:white;stroke-width:1.6}.lane{stroke-width:2}</style><text x="960" y="58" text-anchor="middle" class="t h">甘肃独立储能：从政策与系统特征到经营动作和市场空间</text><text x="960" y="100" text-anchor="middle" class="s">政策与收益构成 → 甘肃能源/网架特征 → 利润形成与问题诊断 → 可落地措施与市场空间</text><rect class="lane" x="40" y="150" width="390" height="850" rx="18" fill="#eaf4ff" stroke="#1677c8"/><text x="60" y="187" class="lh" fill="#1677c8">① 政策与收益构成</text><rect class="lane" x="450" y="150" width="370" height="850" rx="18" fill="#eaf8f3" stroke="#198a6b"/><text x="470" y="187" class="lh" fill="#198a6b">② 甘肃特征与经营约束</text><rect class="lane" x="840" y="150" width="340" height="850" rx="18" fill="#fff6e6" stroke="#d68111"/><text x="860" y="187" class="lh" fill="#d68111">③ 利润形成与核心诊断</text><rect class="lane" x="1200" y="150" width="680" height="850" rx="18" fill="#f7f2ff" stroke="#7c4cc9"/><text x="1220" y="187" class="lh" fill="#7c4cc9">④ 可落地措施与市场空间</text><g><rect class="card" x="65" y="215" width="340" height="175" rx="14" stroke="#77b8e8"/><text x="82" y="245" class="ct t">现货电能量</text><text x="82" y="272" class="cb"><tspan x="82" dy="0">• 电网侧独立储能初期“报量不报价”</tspan><tspan x="82" dy="22">• 充放电按所在节点实时价格结算</tspan><tspan x="82" dy="22">• 15分钟滚动；项目经验可约1小时前调计划</tspan><tspan x="82" dy="22">• 当前定位：SOC管理 + 节点性机会收益</tspan></text><rect class="card" x="65" y="415" width="340" height="225" rx="14" stroke="#77b8e8"/><text x="82" y="445" class="ct t">调频辅助服务</text><text x="82" y="472" class="cb"><tspan x="82">• 日前报价、日内出清；里程报价上限15元/MW</tspan><tspan x="82" dy="22">• 需求≥max(3%负荷+20%新能源，N-1缺口)</tspan><tspan x="82" dy="22">• 中标：低价优先；同价看近5日AGC性能</tspan><tspan x="82" dy="22">• 实际里程由ACE、SOC、节点/断面和调度决定</tspan><tspan x="82" dy="22">• 当前受访项目：主要市场化收入来源</tspan></text><rect class="card" x="65" y="665" width="340" height="220" rx="14" stroke="#77b8e8"/><text x="82" y="695" class="ct t">可靠容量补偿</text><text x="82" y="722" class="cb"><tspan x="82">• 政策基准330元/kW·年；高峰持续时长暂按6h</tspan><tspan x="82" dy="22">• 申报容量≤可靠容量；短时储能按时长折算</tspan><tspan x="82" dy="22">• 受容量供需系数、可用率和顶峰履约影响</tspan><tspan x="82" dy="22">• 月度考核 + 年度清算</tspan><tspan x="82" dy="22">• 项目端实际分摊/到账仍需持续跟踪</tspan></text></g><g><rect class="card" x="475" y="215" width="320" height="175" rx="14" stroke="#55b89c"/><text x="492" y="245" class="ct t">高比例新能源</text><text x="492" y="272" class="cb"><tspan x="492">• 2026年6月底新能源装机8154万kW，占65%</tspan><tspan x="492" dy="22">• 新型储能并网装机突破1000万kW</tspan><tspan x="492" dy="22">• 风光出力时段性强，调节需求显著</tspan><tspan x="492" dy="22">→ 调频、容量支撑和SOC管理价值突出</tspan></text><rect class="card" x="475" y="415" width="320" height="225" rx="14" stroke="#55b89c"/><text x="492" y="445" class="ct t">“大送端” + 河西送出</text><text x="492" y="472" class="cb"><tspan x="492">• 750kV骨干 + 特高压直流 + 省际联络线</tspan><tspan x="492" dy="22">• 2025外送&gt;800亿kWh；外送能力4630万kW</tspan><tspan x="492" dy="22">• 河西风光集中，经河西走廊向中东部/省外输送</tspan><tspan x="492" dy="22">• 局部断面压力造成节点价格与调用差异</tspan></text><rect class="card" x="475" y="665" width="320" height="250" rx="14" stroke="#55b89c"/><text x="492" y="695" class="ct t">经营约束：价值不等于可兑现收益</text><text x="492" y="722" class="cb"><tspan x="492">• 转换效率个案约75%–76%，低于设计水平</tspan><tspan x="492" dy="22">• 故障/备件短缺直接损失调频与现货机会</tspan><tspan x="492" dy="22">• AVC未联调，功率因数费用个案月损7–8万元</tspan><tspan x="492" dy="22">• “两个细则”、退补、清算仍需穿透明细</tspan><tspan x="492" dy="22">• 调频调用机制对项目侧仍有“黑箱”特征</tspan></text></g><g><rect class="card" x="865" y="220" width="290" height="150" rx="14" stroke="#e4a341"/><text x="882" y="250" class="ct t">经营总目标</text><text x="882" y="280" class="cb"><tspan x="882">月度现金毛利 = 现货净收益 + 调频净收益</tspan><tspan x="882" dy="22">+ 容量补偿 − 设备/合规损失</tspan><tspan x="882" dy="22">− 考核与结算调整</tspan></text><rect class="card" x="865" y="395" width="290" height="145" rx="14" stroke="#e4a341"/><text x="882" y="425" class="ct t">资源竞争</text><text x="882" y="455" class="cb"><tspan x="882">现货、调频、容量补偿共同占用</tspan><tspan x="882" dy="22">功率、SOC、可用容量和循环寿命。</tspan><tspan x="882" dy="22">→ 不应分别追求单市场收入最大化。</tspan></text><rect class="card" x="865" y="565" width="290" height="140" rx="14" stroke="#e4a341"/><text x="882" y="595" class="ct t">诊断1：调频</text><text x="882" y="625" class="cb"><tspan x="882">报价决定“能否中标”；</tspan><tspan x="882" dy="22">实际里程决定“拿多少收入”；</tspan><tspan x="882" dy="22">设备性能决定“能否拿满补偿”。</tspan></text><rect class="card" x="865" y="730" width="290" height="150" rx="14" stroke="#e4a341"/><text x="882" y="760" class="ct t">诊断2：现货与结算</text><text x="882" y="790" class="cb"><tspan x="882">理论价差 ≠ 实际捕获价差。</tspan><tspan x="882" dy="22">节点价、计划、调度、计量、退补、考核</tspan><tspan x="882" dy="22">需要统一到15分钟颗粒度复盘。</tspan></text></g><g><rect class="card" x="1225" y="215" width="300" height="160" rx="14" stroke="#a883e0"/><text x="1242" y="245" class="ct t">A. 现货：做“节点净价差”</text><text x="1242" y="275" class="cb"><tspan x="1242">建立节点价—自计划—实际功率—SOC闭环；</tspan><tspan x="1242" dy="22">只有价差覆盖下网费、效率、衰减和机会成本</tspan><tspan x="1242" dy="22">时才主动循环。</tspan></text><rect class="card" x="1545" y="215" width="300" height="160" rx="14" stroke="#a883e0"/><text x="1562" y="245" class="ct t">B. 调频：做“里程净收益”</text><text x="1562" y="275" class="cb"><tspan x="1562">跟踪中标容量、实际里程、K值、单位MW里程；</tspan><tspan x="1562" dy="22">识别高调用窗口并预留SOC/功率空间，</tspan><tspan x="1562" dy="22">提升“被调用概率 × 可兑现性能”。</tspan></text><rect class="card" x="1225" y="400" width="300" height="160" rx="14" stroke="#a883e0"/><text x="1242" y="430" class="ct t">C. 设备运维：先处理确定性损失</text><text x="1242" y="460" class="cb"><tspan x="1242">提升转换效率、缩短故障和备件等待时间；</tspan><tspan x="1242" dy="22">将K值异常作为设备/通信预警，建立</tspan><tspan x="1242" dy="22">交易—运维联动。</tspan></text><rect class="card" x="1545" y="400" width="300" height="160" rx="14" stroke="#a883e0"/><text x="1562" y="430" class="ct t">D. AVC/功率因数：直接增利</text><text x="1562" y="460" class="cb"><tspan x="1562">完成储能侧AVC接入、联调和电网试验；</tspan><tspan x="1562" dy="22">目标是减少功率因数调整费和相关扣减，</tspan><tspan x="1562" dy="22">优先级高于小幅报价优化。</tspan></text><rect class="card" x="1225" y="585" width="300" height="160" rx="14" stroke="#a883e0"/><text x="1242" y="615" class="ct t">E. 结算治理：把“黑箱”拆开</text><text x="1242" y="645" class="cb"><tspan x="1242">穿透上网、下网、调频、两个细则、功率因数、</tspan><tspan x="1242" dy="22">退补/清算，建立“触发—原始数据—公式—</tspan><tspan x="1242" dy="22">扣减—申诉/退回”台账。</tspan></text><rect class="card" x="1545" y="585" width="300" height="160" rx="14" stroke="#a883e0"/><text x="1562" y="615" class="ct t">F. 容量与投资：优化申报而非报满</text><text x="1562" y="645" class="cb"><tspan x="1562">基于衰减、可用率、顶峰SOC确定可兑现容量；</tspan><tspan x="1562" dy="22">扩容不能按单位MW收益线性外推，要重新评估</tspan><tspan x="1562" dy="22">节点、断面、竞争和调用盘子。</tspan></text><rect x="1225" y="775" width="620" height="170" rx="14" fill="#fdf9ff" stroke="#a883e0" stroke-width="1.6"/><text x="1242" y="805" class="ct" fill="#59359a">市场空间与边界</text><text x="1242" y="835" class="cb"><tspan x="1242">短期（2026–2027）：调频仍是受访项目最主要增量来源；可靠容量补偿提供新政策价值；</tspan><tspan x="1242" dy="22">现货更偏节点性机会。中期：新增储能、抽蓄等会加剧调频竞争，容量供需系数也可能下降。</tspan><tspan x="1242" dy="22">核心判断：甘肃不是“平均价差型市场”，而是“节点 + 调度调用 + 设备性能 + 结算治理”共同决定价值。</tspan></text></g><text x="960" y="1045" text-anchor="middle" class="s">图中政策与调研分层使用；个案数据不外推为甘肃全省平均水平。</text></svg>